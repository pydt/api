name: Deploy PYDT API
permissions:
  contents: read
on:
  push:
    branches:
      - master
      - develop
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g npm@^11
      - run: |
          npm install
          npm run test
          docker compose -f testdata/docker-compose.yml up -d
          npm run integration-test
          npm run deploy-${GITHUB_REF##*/}
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
          JWT_SECRET: ${{secrets.JWT_SECRET}}
          ROLLBAR_API_KEY: ${{secrets.ROLLBAR_API_KEY}}
          DISCOURSE_API_KEY: ${{secrets.DISCOURSE_API_KEY}}
          STEAM_API_KEY: ${{secrets.STEAM_API_KEY}}
          VAPID_PRIVATE_KEY: ${{secrets.VAPID_PRIVATE_KEY}}
      # Mark the deploy in Rollbar so items can be tied to it (revision matches the
      # codeVersion the API reports). A Rollbar failure doesn't fail the deploy.
      - name: Report deploy to Rollbar
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then ENVIRONMENT=prod; else ENVIRONMENT=dev; fi
          curl -sS --fail-with-body https://api.rollbar.com/api/1/deploy \
            -H "X-Rollbar-Access-Token: $ROLLBAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"environment\":\"$ENVIRONMENT\",\"revision\":\"$GITHUB_SHA\",\"local_username\":\"$GITHUB_ACTOR\",\"status\":\"succeeded\"}" \
            || echo "::warning::Could not report the deploy to Rollbar"
        env:
          ROLLBAR_API_KEY: ${{secrets.ROLLBAR_API_KEY}}